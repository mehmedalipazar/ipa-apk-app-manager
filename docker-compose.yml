# =============================================================================
#  ipa-ota-download — self-hosted kurulum
#
#      docker compose up -d --build
#
#  IKI BAGIMSIZ SERVIS — aralarinda container-ici trafik YOKTUR, bu yuzden
#  ortak bir ag tanimlanmaz:
#      api  ->  http://localhost:3000   API (/api/*) + OTA kurulum (/api/i/*)
#      web  ->  http://localhost:5173   Admin arayuzu (statik SPA)
#
#  TERS PROXY BU DOSYADA YOKTUR — devops tarafinda nginx ile yapilandirilir.
#  Beklenen yonlendirme (ayni alan adi altinda):
#      https://ipa-ios.simurgbilisim.com/        ->  web:8080
#      https://ipa-ios.simurgbilisim.com/api/*   ->  api:3000
#
#  Bu ayrim sayesinde arayuz GORELI YOL kullanir; CORS'a gerek kalmaz ve
#  oturum cerezi SameSite=Lax kalir. Proxy ayarlari icin README'ye bakin.
#
#  YAPILANDIRMA KAYNAGI:
#    - Uretim varsayilanlari  ->  backend/.env.production (imaja gomulu)
#    - Sirlar ve ezmeler      ->  bu dosyanin environment: blogu (.env'den okur)
#  Gercek ortam degiskeni imajdaki dosyayi her zaman EZER.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ipa-ota-api:latest
    restart: unless-stopped
    environment:
      # --- Sirlar (kok .env dosyasindan) ---
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD tanimlanmali - .env dosyasina yazin}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET tanimlanmali - openssl rand -hex 32}
      ADMIN_PASSWORD_FORCE_RESET: ${ADMIN_PASSWORD_FORCE_RESET:-false}

      # --- Istege bagli ezmeler ---
      # Bos birakilirsa backend/.env.production icindeki degerler gecerli olur.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://ipa-ios.simurgbilisim.com}
      INSTALL_PATH_PREFIX: ${INSTALL_PATH_PREFIX:-/api/i}
      # BOS BIRAKIN: arayuz ayni origin uzerinden sunuluyor.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Ters proxy arkasindayiz — X-Forwarded-* basliklarina guvenilir.
      # Proxy YOKSA false yapin: aksi halde istemci kendi IP'sini uydurabilir.
      TRUST_PROXY: ${TRUST_PROXY:-true}

      # NODE_ENV / PORT / DATA_DIR BILEREK BURADA DEGIL: kaynaklari imaja
      # gomulu backend/.env.production. Compose'da listelenmedikleri icin kok
      # .env dosyasindaki ayni adli bir degisken container'a HIC ULASMAZ.
    volumes:
      # SQLite veritabani + yuklenen IPA dosyalari.
      #
      # BIND MOUNT (adlandirilmis volume DEGIL): veriler host'ta ./data-docker
      # icinde durur, boylece SQLite dosyasi dogrudan acilabilir:
      #     sqlite3 data-docker/ipa-ota.db "select app_name, version from builds;"
      #
      # BU DIZINI YEDEKLEYIN.
      - ./data-docker:/data
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ipa-ota-web:latest
    restart: unless-stopped
    # API adresi imaja GOMULU DEGIL ve calisma aninda da ayarlanmaz:
    # arayuz goreli yol kullanir. Bu servisin hicbir ortam degiskeni yoktur.
    ports:
      # Sol taraf host portu; sag taraf container icindeki nginx (sabit 8080).
      - "${WEB_PORT:-5173}:8080"
