# =============================================================================
#  Admin arayuzu — statik SPA sunumu
#
#  Bu servis YALNIZCA statik dosya sunar; API'ye proxy YAPMAZ.
#
#  Uretimde arayuz ile API ayni alan adi altindadir ve bu ayrimi ONDEKI ters
#  proxy yapar (devops tarafinda):
#      /        ->  bu servis (SPA)
#      /api/*   ->  backend:3000
#  Arayuz bu yuzden goreli yol kullanir; VITE_API_BASE_URL bostur.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Yuklenen IPA'lar API tarafinda; buraya buyuk govde gelmez.
    client_max_body_size 1m;

    include /etc/nginx/snippets/guvenlik-basliklari.conf;

    # Her derlemede asset adlari degisir; index.html taze gelmeli.
    location = /index.html {
        include /etc/nginx/snippets/guvenlik-basliklari.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Dosya adlarinda icerik hash'i var — uzun sureli onbellek guvenli.
    location /assets/ {
        include /etc/nginx/snippets/guvenlik-basliklari.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: bilinmeyen yollar istemci tarafi router'a birakilir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
