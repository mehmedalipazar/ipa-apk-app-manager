# nginx'te add_header MIRAS ALINMAZ: bir location kendi add_header'ini
# tanimladigi anda ust bloktakiler duser. Bu yuzden ortak basliklar burada
# toplanip her blokta include ediliyor.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
